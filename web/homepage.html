<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS2市场大盘 - SteamDT</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="homepage.css">
    <!-- Lightweight Charts - 使用固定版本 -->
    <script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
    <!-- 顶部导航栏 -->
    <nav class="navbar">
        <div class="navbar-content">
            <div class="logo">
                <span>STEAM</span><span style="color: #5b9aff;">DT</span>
            </div>
            <div class="nav-menu">
                <a href="homepage.html" class="nav-item active">首页</a>
                <a href="index.html" class="nav-item">饰品市场</a>
                <a href="#" class="nav-item">排行榜</a>
                <a href="#" class="nav-item">库存估价</a>
                <a href="prediction.html" class="nav-item">价格预测</a>
            </div>
            <div class="nav-actions">
                <button class="btn-primary" onclick="refreshData()">🔄 刷新数据</button>
            </div>
        </div>
    </nav>

    <!-- 主容器 -->
    <div class="container" style="margin-top: 80px;">
        <!-- 大盘指数标题栏 -->
        <div class="market-header">
            <div class="market-title">
                <div style="margin-bottom: 15px;">
                    <span style="font-size: 18px; color: #666;">大盘</span>
                    <span style="font-size: 14px; color: #999; margin-left: 10px;">更新时间: <span id="updateTimeTop">-</span></span>
                </div>
                <div style="margin-bottom: 15px;">
                    <span id="indexValue" style="font-size: 32px; font-weight: bold;">-</span>
                    <span id="indexChange" style="font-size: 20px; margin-left: 15px; font-weight: bold;">-</span>
                </div>
                <div class="market-info">
                    <span class="info-item">今日: <span id="todayIndex" style="font-weight: bold;">-</span></span>
                    <span class="info-item">最高: <span id="highIndex">-</span></span>
                    <span class="info-item">昨日: <span id="yesterdayIndex">-</span></span>
                    <span class="info-item">最低: <span id="lowIndex">-</span></span>
                    <span class="info-item">涨跌值: <span id="riseFallDiff">-</span></span>
                    <span class="info-item">涨跌幅: <span id="riseFallRate">-</span></span>
                    <span class="info-item">成交量: <span id="volume">-</span></span>
                </div>
            </div>
        </div>

        <!-- K线图表容器 -->
        <div class="chart-container">
            <div class="chart-controls">
                <button class="chart-btn active" data-type="hour">时K</button>
                <button class="chart-btn" data-type="day">日K</button>
                <button class="chart-btn" onclick="refreshData()">🔄 刷新</button>
            </div>
            <div id="klineChart"></div>
        </div>

        <!-- 涨跌统计 -->
        <div class="market-stats-row">
            <div class="stat-box up">
                <div class="stat-label">上涨</div>
                <div class="stat-value" id="upNum">-</div>
            </div>
            <div class="stat-box flat">
                <div class="stat-label">持平</div>
                <div class="stat-value" id="flatNum">-</div>
            </div>
            <div class="stat-box down">
                <div class="stat-label">下跌</div>
                <div class="stat-value" id="downNum">-</div>
            </div>
        </div>

        <!-- 各类别指数 -->
        <div class="section-card">
            <h3>各类别指数</h3>
            <div id="categoriesList" class="categories-grid">
                <div class="loading">加载中...</div>
            </div>
        </div>

        <!-- 热门板块 -->
        <div class="section-card">
            <h3>热门板块</h3>
            <div id="hotList" class="hot-grid">
                <div class="loading">加载中...</div>
            </div>
        </div>
    </div>

    <script src="homepage_kline.js?v=6.0"></script>
</body>
</html>
